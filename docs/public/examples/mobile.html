<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet móvil — dgarz design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dist/dgarz.full.min.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: var(--dg-font-sans);
      background:
        radial-gradient(circle at 18% 14%, rgba(255,255,255,.78) 0, rgba(255,255,255,0) 18%),
        radial-gradient(circle at 78% 20%, rgba(107,132,255,.36) 0, rgba(107,132,255,0) 24%),
        linear-gradient(180deg, #d7e3ff, #ebf1ff 55%, #f5f8ff);
      padding: 28px 14px;
    }
    .phone {
      width: min(100%, 390px);
      min-height: 820px;
      border-radius: 40px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.78);
      background:
        linear-gradient(180deg, rgba(255,255,255,.44), rgba(255,255,255,.2)),
        radial-gradient(circle at 78% 0%, rgba(112,152,255,.22), transparent 22%);
      box-shadow: 0 30px 80px rgba(31, 52, 94, .18);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      padding: 18px 16px 24px;
      display: grid;
      gap: 14px;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .84rem;
      padding: 4px 4px 2px;
    }
    .hero {
      padding: 18px;
      border-radius: 30px;
      color: #fff;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,.22) 0, rgba(255,255,255,0) 28%),
        linear-gradient(145deg, #111317, #1f54ff 55%, #9cc5ff 140%);
      box-shadow: 0 24px 40px rgba(31,84,255,.2);
    }
    .hero-bubbles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 18px 0 12px;
    }
    .hero-bubbles div {
      aspect-ratio: 1;
      border-radius: 999px;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 10px;
      color: #fff;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.22);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .hero-bubbles div.is-focus {
      background: radial-gradient(circle, rgba(146,126,255,.84), rgba(89,119,255,.82));
      box-shadow: 0 16px 36px rgba(121,118,255,.28);
    }
    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .panel {
      border-radius: 28px;
      padding: 18px;
    }
    .chart {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      align-items: end;
      height: 94px;
      margin-top: 16px;
    }
    .chart span {
      display: block;
      border-radius: 14px 14px 8px 8px;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(217,229,255,.94));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }
    .chart span.is-accent {
      background: linear-gradient(180deg, #5596ff, #89b8ff);
      box-shadow: 0 12px 24px rgba(85,150,255,.22);
    }
    .list {
      display: grid;
      gap: 10px;
    }
    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 20px;
      background: rgba(255,255,255,.48);
      border: 1px solid rgba(17,19,23,.05);
    }
    .icon-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.82);
      flex-shrink: 0;
    }
    .bottom-nav {
      margin-top: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 10px;
      border-radius: 26px;
      background: rgba(255,255,255,.5);
      border: 1px solid rgba(255,255,255,.66);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .bottom-nav button {
      appearance: none;
      border: none;
      background: transparent;
      padding: 10px 0;
      border-radius: 18px;
      color: var(--dg-text-muted);
      font-weight: 600;
    }
    .bottom-nav button.is-active {
      color: #fff;
      background: linear-gradient(135deg, #277dff, #6ea8ff);
      box-shadow: 0 16px 28px rgba(39,125,255,.22);
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status">
      <strong>9:41</strong>
      <span>5G · 100%</span>
    </div>

    <div class="dg-flex dg-items-center dg-justify-between">
      <button class="dg-btn dg-btn-glass dg-btn-icon" aria-label="menu">≡</button>
      <div class="dg-glass-pill">Wallet mobile</div>
      <span class="dg-btn dg-btn-glass dg-btn-icon">◌</span>
    </div>

    <section class="hero">
      <div class="dg-flex dg-items-start dg-justify-between">
        <div>
          <div class="dg-text-sm" style="color:rgba(255,255,255,.72)">Total balance</div>
          <div style="font-size:2.45rem;font-weight:700;margin-top:6px">$73,558.00</div>
        </div>
        <span class="dg-glass-pill" style="color:#fff;border-color:rgba(255,255,255,.2)">USD</span>
      </div>

      <div class="hero-bubbles">
        <div><strong>$10,208</strong><span class="dg-text-sm">Visa</span></div>
        <div class="is-focus"><strong>$23,558</strong><span class="dg-text-sm">Mastercard</span></div>
        <div><strong>$39,792</strong><span class="dg-text-sm">Savings</span></div>
      </div>

      <div class="quick-actions">
        <button class="dg-btn dg-btn-glass">Receive money</button>
        <button class="dg-btn" style="background:#111317;color:#fff">Send money</button>
      </div>
    </section>

    <section class="panel dg-surface-liquid">
      <div class="dg-flex dg-items-center dg-justify-between">
        <div>
          <div class="dg-text-sm dg-muted">Expense statistic</div>
          <div class="dg-card-title" style="font-size:1.5rem">Monthly</div>
        </div>
        <button class="dg-btn dg-btn-glass dg-btn-sm">Jul</button>
      </div>
      <div class="chart">
        <span style="height:46%"></span>
        <span style="height:58%"></span>
        <span class="is-accent" style="height:84%"></span>
        <span style="height:62%"></span>
        <span style="height:78%"></span>
      </div>
    </section>

    <section class="panel dg-surface-gradient-cool dg-surface-shine">
      <div class="dg-flex dg-items-center dg-justify-between">
        <div>
          <div class="dg-text-sm dg-muted">Financial health</div>
          <div style="font-size:2rem;font-weight:700;margin-top:6px">85%</div>
        </div>
        <button class="dg-btn dg-btn-glass dg-btn-icon">↻</button>
      </div>
      <div class="dg-text-sm dg-mt-2" style="color:rgba(17,19,23,.68)">since last month</div>
    </section>

    <section class="panel dg-surface-glass-strong">
      <div class="dg-flex dg-items-center dg-justify-between dg-mb-3">
        <div class="dg-card-title" style="font-size:1.35rem">Upcoming payments</div>
        <button class="dg-btn dg-btn-gradient dg-btn-sm">View all</button>
      </div>
      <div class="list">
        <div class="list-item">
          <div class="dg-flex dg-items-center dg-gap-3">
            <span class="icon-dot">◉</span>
            <div>
              <div style="font-weight:600">Stripe pricing</div>
              <div class="dg-text-sm dg-muted">Today</div>
            </div>
          </div>
          <strong>$1,200</strong>
        </div>
        <div class="list-item">
          <div class="dg-flex dg-items-center dg-gap-3">
            <span class="icon-dot">✦</span>
            <div>
              <div style="font-weight:600">Figma membership</div>
              <div class="dg-text-sm dg-muted">Jun 23</div>
            </div>
          </div>
          <strong>$155</strong>
        </div>
        <div class="list-item">
          <div class="dg-flex dg-items-center dg-gap-3">
            <span class="icon-dot">✺</span>
            <div>
              <div style="font-weight:600">Loom subscription</div>
              <div class="dg-text-sm dg-muted">Jul 15</div>
            </div>
          </div>
          <strong>$100</strong>
        </div>
      </div>
    </section>

    <div class="bottom-nav">
      <button class="is-active">Home</button>
      <button>Cards</button>
      <button>Stats</button>
      <button>Profile</button>
    </div>
  </div>
</body>
</html>
